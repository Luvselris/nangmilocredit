<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Dashboard ♡ Nangmilo Review</title>
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --color-charcoal: #545258;
      --color-charcoal-dark: #38363d;
      --color-grey-soft: #8e8b94;
      --color-blush-pink: #ebdbe3;
      --card-bg: rgba(255, 255, 255, 0.96);
      --border-tone: rgba(181, 140, 164, 0.4);
      --text: #2f2d33;
      --danger: #ef4444;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Quicksand', 'Mitr', sans-serif; }
    body { background: radial-gradient(circle at top, #faf8f9 0%, #f4f1f2 50%, #e7e2e6 100%); color: var(--text); min-height: 100vh; padding: 20px 14px 80px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 480px; }
    
    .card {
      background: var(--card-bg); border-radius: 24px; padding: 20px 18px;
      box-shadow: 0 8px 25px rgba(84, 82, 88, 0.1); border: 1.5px solid #fff; margin-bottom: 16px;
    }
    .title { font-size: 18px; font-weight: 700; color: var(--color-charcoal); text-align: center; margin-bottom: 16px; }
    .field-group { margin-bottom: 14px; }
    .field-label { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 6px; display: block; }
    .input-box, .textarea-box {
      width: 100%; padding: 11px 14px; border-radius: 14px; border: 1.5px solid var(--border-tone);
      outline: none; font-size: 13.5px; background: #fff; color: var(--text); transition: all 0.2s;
    }
    .input-box:focus, .textarea-box:focus { border-color: var(--color-charcoal); }
    .textarea-box { resize: vertical; min-height: 80px; line-height: 1.5; }

    .file-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 9px 14px; background: #faf7f8; border: 1.5px dashed var(--color-charcoal);
      border-radius: 14px; color: var(--color-charcoal); font-size: 12.5px; font-weight: 600;
      cursor: pointer; width: 100%; margin-bottom: 6px;
    }

    .btn {
      width: 100%; padding: 12px; border-radius: 18px; border: none; font-size: 14.5px; font-weight: 700;
      cursor: pointer; background: linear-gradient(135deg, var(--color-charcoal), var(--color-charcoal-dark)); color: #fff; margin-top: 6px;
      box-shadow: 0 4px 14px rgba(84, 82, 88, 0.25); transition: opacity 0.2s;
    }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-secondary { background: #fff; color: var(--color-charcoal); border: 1.5px solid var(--border-tone); margin-top: 10px; box-shadow: none; }
    
    .btn-add {
      background: #faf7f8; color: var(--color-charcoal); border: 1.5px dashed var(--color-charcoal);
      font-size: 13px; padding: 10px; border-radius: 14px; margin-top: 8px; width: 100%; cursor: pointer; font-weight: 700;
    }

    .hl-edit-box {
      background: #faf8f9; border: 1.5px solid var(--border-tone); border-radius: 18px;
      padding: 14px; margin-bottom: 14px; position: relative;
    }
    .hl-header-bar {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;
    }
    .hl-tag { font-size: 13px; font-weight: 700; color: var(--color-charcoal); }
    .hl-delete-btn {
      background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid #ef4444;
      padding: 4px 10px; border-radius: 10px; font-size: 11.5px; font-weight: 600; cursor: pointer;
    }
    .hl-gallery {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px;
    }
    .hl-img-wrap { position: relative; aspect-ratio: 1/1; border-radius: 8px; overflow: hidden; background: #fff; border: 1px solid var(--border-tone); }
    .hl-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .hl-img-del {
      position: absolute; top: 2px; right: 2px; background: rgba(239, 68, 68, 0.85); color: #fff;
      border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }

    .review-del-item {
      background: #ffffff; border: 1px solid var(--border-tone); border-radius: 14px; padding: 12px; margin-bottom: 8px;
      display: flex; justify-content: space-between; align-items: center;
    }

    .status-msg {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: #38363d; color: #fff; border: 1px solid var(--border-tone); padding: 10px 20px; border-radius: 20px;
      font-size: 13px; z-index: 999999; display: none; box-shadow: 0 4px 14px rgba(0,0,0,0.2);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">
  <div class="card" id="loginBox">
    <div class="title">เข้าสู่ระบบแอดมิน ♡ Nangmilo Review</div>
    <div class="field-group">
      <label class="field-label">email</label>
      <input type="text" id="loginEmail" class="input-box" placeholder="email">
    </div>
    <div class="field-group">
      <label class="field-label">password</label>
      <input type="password" id="loginPassword" class="input-box" placeholder="password">
    </div>
    <button type="button" class="btn" onclick="handleLogin()">เข้าสู่ระบบ</button>
  </div>

  <div id="dashboardBox" class="hidden">
    
    <!-- 1. ข้อมูลส่วนตัว & โปรไฟล์ -->
    <div class="card">
      <div class="title">ข้อมูลโปรไฟล์และแบนเนอร์</div>
      <div class="field-group">
        <label class="field-label">ชื่อหัวเว็บ</label>
        <input type="text" id="siteTitle" class="input-box">
      </div>
      <div class="field-group">
        <label class="field-label">ชื่อผู้ใช้</label>
        <input type="text" id="username" class="input-box">
      </div>
      <div class="field-group">
        <label class="field-label">แฮนเดิล</label>
        <input type="text" id="handle" class="input-box">
      </div>
      <div class="field-group">
        <label class="field-label">คำอธิบาย Bio</label>
        <textarea id="bio" class="textarea-box"></textarea>
      </div>

      <div class="field-group">
        <label class="field-label">แบนเนอร์</label>
        <label class="file-btn">เลือกรูปภาพจากเครื่อง <input type="file" accept="image/*" style="display:none;" onchange="uploadDirectImage(event, 'bannerImg')"></label>
        <input type="text" id="bannerImg" class="input-box">
      </div>

      <div class="field-group">
        <label class="field-label">รูปโปรไฟล์</label>
        <label class="file-btn">เลือกรูปจากเครื่อง <input type="file" accept="image/*" style="display:none;" onchange="uploadDirectImage(event, 'profileImg')"></label>
        <input type="text" id="profileImg" class="input-box">
      </div>

      <div class="field-group">
        <label class="field-label">กรอบโปรไฟล์</label>
        <label class="file-btn">เลือกรูปกรอบจากเครื่อง <input type="file" accept="image/*" style="display:none;" onchange="uploadDirectImage(event, 'discordFrame')"></label>
        <input type="text" id="discordFrame" class="input-box">
      </div>
    </div>

    <!-- 2. จัดการไฮไลท์รีวิว -->
    <div class="card">
      <div class="title">จัดการไฮไลท์สตอรี่ (ใส่รูปได้ไม่จำกัด)</div>
      <div id="highlightsManager"></div>
      <button type="button" class="btn-add" onclick="addNewHighlight()">+ เพิ่มไฮไลท์ใหม่</button>
    </div>

    <!-- 3. จัดการโพสต์หน้า Home (เพิ่ม/ลบได้ไม่จำกัด ไม่ติด Limit 1MB) -->
    <div class="card">
      <div class="title">จัดการโพสต์หน้า Home (เพิ่มได้ไม่จำกัด)</div>
      <div id="postsManager"></div>
      <button type="button" class="btn-add" onclick="addNewPostItem()">+ เพิ่มโพสต์ใหม่</button>
    </div>

    <!-- 4. ลบ/จัดการรีวิวลูกค้า -->
    <div class="card">
      <div class="title">จัดการรีวิวจากลูกค้า</div>
      <div id="customerFeedbackManager"></div>
    </div>

    <!-- 5. Details & Contact -->
    <div class="card">
      <div class="title">รายละเอียดและการติดต่อ</div>
      <div class="field-group">
        <label class="field-label">เนื้อหาหน้า Details</label>
        <textarea id="detailsContent" class="textarea-box"></textarea>
      </div>

      <div class="field-group">
        <label class="field-label">ลิงก์ช่องทางติดต่อ 1 (LINE)</label>
        <input type="text" id="contactTitle1" class="input-box" value="LINE (siamfineshyt)" style="margin-bottom:6px;">
        <input type="text" id="contactUrl1" class="input-box">
      </div>

      <div class="field-group">
        <label class="field-label">ลิงก์ช่องทางติดต่อ 2 (Donate)</label>
        <input type="text" id="contactTitle2" class="input-box" value="Donate click ♡" style="margin-bottom:6px;">
        <input type="text" id="contactUrl2" class="input-box">
      </div>

      <div class="field-group">
        <label class="field-label">ลิงก์ช่องทางติดต่อ 3</label>
        <input type="text" id="contactTitle3" class="input-box" value="ช่องทางอื่นๆ" style="margin-bottom:6px;">
        <input type="text" id="contactUrl3" class="input-box">
      </div>
    </div>

    <!-- 6. เพลง -->
    <div class="card">
      <div class="title">เพลงประกอบ</div>
      <div class="field-group">
        <label class="field-label">URL เพลง (.mp3)</label>
        <input type="text" id="musicUrl" class="input-box">
      </div>
    </div>

    <!-- 7. บัญชีแอดมิน -->
    <div class="card">
      <div class="title">บัญชีและความปลอดภัยแอดมิน</div>
      <div class="field-group">
        <label class="field-label">email แอดมิน</label>
        <input type="email" id="adminEmailInput" class="input-box">
      </div>
      <div class="field-group">
        <label class="field-label">รหัสผ่านใหม่</label>
        <input type="password" id="newAdminPassword" class="input-box" placeholder="ปล่อยว่างหากไม่เปลี่ยน">
      </div>
    </div>

    <button type="button" class="btn" id="saveBtn" onclick="saveAllConfig()">บันทึกขึ้นระบบทันที</button>
    <button type="button" class="btn btn-secondary" onclick="logout()">ออกจากระบบ</button>
  </div>
</div>

<div class="status-msg" id="statusMsg"></div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCpAGDSy1NRgmLV_g7qJrCpwOhU9MrfQyY",
    authDomain: "benefitie.firebaseapp.com",
    projectId: "benefitie",
    storageBucket: "benefitie.firebasestorage.app",
    messagingSenderId: "270365672215",
    appId: "1:270365672215:web:230d1491091e26ce83ed52"
  };

  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const DB_SITE = "nangmilo_review_site";
  const DB_POSTS = "nangmilo_review_posts";
  const DB_FEEDBACK = "nangmilo_review_feedback";
  const DB_HL_SLIDES = "nangmilo_review_hl_slides";

  let adminUsername = "moonlightbae";
  let currentAdminEmail = "Gplusgplus500@gmail.com";
  let currentAdminPass = "Meow4U!7";

  let highlightsData = [];
  let postsData = [];

  db.collection(DB_SITE).doc("config").get().then(doc => {
    if (doc.exists) {
      const d = doc.data();
      if (d.adminUsername) adminUsername = d.adminUsername;
      if (d.adminEmail) currentAdminEmail = d.adminEmail;
      if (d.adminPass) currentAdminPass = d.adminPass;
    }
  });

  function showStatus(text, isError = false) {
    const el = document.getElementById("statusMsg");
    el.textContent = text;
    el.style.background = isError ? "#ef4444" : "#545258";
    el.style.display = "block";
    setTimeout(() => { el.style.display = "none"; }, 3000);
  }

  function handleLogin() {
    const inputVal = document.getElementById("loginEmail").value.trim();
    const p = document.getElementById("loginPassword").value.trim();
    
    const isUserMatch = (inputVal === adminUsername || inputVal.toLowerCase() === currentAdminEmail.toLowerCase());

    if (isUserMatch && p === currentAdminPass) {
      document.getElementById("loginBox").classList.add("hidden");
      document.getElementById("dashboardBox").classList.remove("hidden");
      loadData();
      listenCustomerFeedbacks();
    } else {
      alert("email หรือ password ไม่ถูกต้องค่ะ");
    }
  }

  function compressImage(file, maxDimension = 1080, quality = 0.8) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          let width = img.width;
          let height = img.height;
          if (width > maxDimension || height > maxDimension) {
            if (width > height) {
              height = Math.round((height * maxDimension) / width);
              width = maxDimension;
            } else {
              width = Math.round((width * maxDimension) / height);
              height = maxDimension;
            }
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function uploadDirectImage(event, targetInputId) {
    const file = event.target.files[0];
    if (!file) return;
    showStatus("กำลังแปลงไฟล์รูปภาพ...");
    try {
      const base64 = await compressImage(file, 800, 0.8);
      document.getElementById(targetInputId).value = base64;
      showStatus("เลือกรูปภาพสำเร็จ");
    } catch (err) {
      showStatus("เกิดข้อผิดพลาดในการโหลดรูป", true);
    }
  }

  async function loadData() {
    showStatus("กำลังดึงข้อมูลล่าสุด...");
    try {
      const doc = await db.collection(DB_SITE).doc("config").get();
      const d = doc.exists ? doc.data() : {};
      
      document.getElementById("siteTitle").value = d.siteTitle || "Nangmilo";
      document.getElementById("username").value = d.username || "Nangmilo";
      document.getElementById("handle").value = d.handle || "@nangmilo";
      document.getElementById("bio").value = d.bio || "สวัสดีค่าเว็ปร้านนังไมโลเองงย้ายมาในนี้ หลังซื้อขายบริการฝาก+1ให้ทีนะคะ ขอบคุณมากๆที่สนับสนุนร้านเราค่ะ รับทำป้ายเครดิต ป้ายidentity v ป้ายต่างๆสามารถสอบถามเพิ่มเติมได้ค่า\nมีปัญหาแจ้งไลน์ siamfineshyt  ไม่มี @ ค่ะ ♡";
      document.getElementById("bannerImg").value = d.bannerImg || "https://file.garden/asG8Gt-rqWIpi3II/line_oa_chat_261025_185339.jpeg";
      document.getElementById("profileImg").value = d.profileImg || "https://file.garden/asG8Gt-rqWIpi3II/line_oa_chat_261025_185325.jpeg";
      document.getElementById("discordFrame").value = d.discordFrame || "https://files.catbox.moe/0exhgz.png";

      if (d.highlights && Array.isArray(d.highlights)) {
        highlightsData = [];
        for (let i = 0; i < d.highlights.length; i++) {
          const hl = { ...d.highlights[i] };
          const slidesSnap = await db.collection(DB_HL_SLIDES).doc(String(i)).collection("images").orderBy("idx", "asc").get();
          if (!slidesSnap.empty) {
            hl.images = slidesSnap.docs.map(s => s.data().url);
          } else if (!hl.images) {
            hl.images = [];
          }
          highlightsData.push(hl);
        }
      } else {
        highlightsData = [
          { title: "รีวิวร้าน", cover: "", images: [] },
          { title: "ผลงานป้าย", cover: "", images: [] }
        ];
      }
      renderHighlightManagers();

      // ดึงโพสต์จาก Collection แยกอิสระ
      const postsSnap = await db.collection(DB_POSTS).orderBy("idx", "asc").get();
      postsData = [];
      postsSnap.forEach(s => postsData.push({ id: s.id, ...s.data() }));
      if (!postsData.length) {
        postsData = Array(6).fill().map((_, i) => ({ image: "", caption: `Post ${i+1}` }));
      }
      renderPostsManager();

      document.getElementById("detailsContent").value = d.details || "ยินดีต้อนรับสู่ร้าน Nangmilo ค่ะ สามารถสอบถามรายละเอียดและดูรีวิวได้เลยนะคะ ♡";
      
      document.getElementById("contactTitle1").value = (d.contacts && d.contacts[0]) ? d.contacts[0].title : "LINE (siamfineshyt)";
      document.getElementById("contactUrl1").value = (d.contacts && d.contacts[0]) ? d.contacts[0].url : "https://line.me/ti/p/sVv-sPte7r";

      document.getElementById("contactTitle2").value = (d.contacts && d.contacts[1]) ? d.contacts[1].title : "Donate click ♡";
      document.getElementById("contactUrl2").value = (d.contacts && d.contacts[1]) ? d.contacts[1].url : "https://ezdn.app/holymoney";

      document.getElementById("contactTitle3").value = (d.contacts && d.contacts[2]) ? d.contacts[2].title : "ช่องทางอื่นๆ";
      document.getElementById("contactUrl3").value = (d.contacts && d.contacts[2]) ? d.contacts[2].url : "";

      document.getElementById("musicUrl").value = d.musicUrl || "https://file.garden/asG8Gt-rqWIpi3II/Ariana%20Grande%20-%20intro%20(end%20of%20the%20world)%20(extended)%20(lyric%20visualizer).mp3";
      document.getElementById("adminEmailInput").value = currentAdminEmail;

      showStatus("โหลดข้อมูลสำเร็จ");
    } catch (err) {
      showStatus("ไม่สามารถดึงข้อมูลได้: " + err.message, true);
    }
  }

  function renderHighlightManagers() {
    const box = document.getElementById("highlightsManager");
    box.innerHTML = "";
    highlightsData.forEach((hl, idx) => {
      const wrap = document.createElement("div");
      wrap.className = "hl-edit-box";
      wrap.innerHTML = `
        <div class="hl-header-bar">
          <span class="hl-tag">ไฮไลท์สตอรี่ที่ ${idx+1} (${hl.title || ''})</span>
          <button type="button" class="hl-delete-btn" onclick="deleteEntireHighlight(${idx})">ลบไฮไลท์นี้</button>
        </div>
        <div class="field-group">
          <label class="field-label">ชื่อไฮไลท์</label>
          <input type="text" class="input-box" value="${hl.title || ''}" oninput="highlightsData[${idx}].title = this.value">
        </div>
        <div class="field-group">
          <label class="field-label">รูปหน้าปกไฮไลท์</label>
          <input type="text" class="input-box" id="hl-cover-${idx}" value="${hl.cover || ''}" placeholder="URL หน้าปก" oninput="highlightsData[${idx}].cover = this.value">
        </div>
        <label class="file-btn">
          อัปโหลดรูปเพิ่มเข้าสตอรี่นี้ (เลือกได้หลายภาพ ไม่จำกัด)
          <input type="file" accept="image/*" multiple style="display:none;" onchange="uploadStoryImages(event, ${idx})">
        </label>
        <div style="font-size:12px; color:var(--color-grey-soft); margin-top:4px;">มี ${hl.images ? hl.images.length : 0} ภาพในสตอรี่</div>
        <div class="hl-gallery" id="hl-gal-${idx}"></div>
      `;
      box.appendChild(wrap);

      const gal = wrap.querySelector(`#hl-gal-${idx}`);
      if (hl.images) {
        hl.images.forEach((imgUrl, imgIdx) => {
          const item = document.createElement("div");
          item.className = "hl-img-wrap";
          item.innerHTML = `
            <img src="${imgUrl}">
            <button type="button" class="hl-img-del" onclick="removeStoryImage(${idx}, ${imgIdx})">×</button>
          `;
          gal.appendChild(item);
        });
      }
    });
  }

  function deleteEntireHighlight(index) {
    if (confirm(`ต้องการลบไฮไลท์ "${highlightsData[index].title || 'รีวิว'}" นี้ใช่ไหมคะ?`)) {
      highlightsData.splice(index, 1);
      renderHighlightManagers();
    }
  }

  function addNewHighlight() {
    highlightsData.push({
      title: `Highlight ${highlightsData.length + 1}`,
      cover: "",
      images: []
    });
    renderHighlightManagers();
  }

  async function uploadStoryImages(event, hlIndex) {
    const files = Array.from(event.target.files);
    if (!files.length) return;
    if (!highlightsData[hlIndex].images) highlightsData[hlIndex].images = [];
    
    showStatus("กำลังอัปโหลดและปรับขนาดภาพ...");
    for (const file of files) {
      try {
        const base64 = await compressImage(file, 1080, 0.8);
        highlightsData[hlIndex].images.push(base64);
      } catch (err) {
        console.error("บีบอัดรูปไม่ผ่าน", err);
      }
    }
    renderHighlightManagers();
    showStatus("เพิ่มภาพสตอรี่สำเร็จ (กดปุ่มบันทึกเพื่ออัปเดต)");
  }

  function removeStoryImage(hlIndex, imgIndex) {
    highlightsData[hlIndex].images.splice(imgIndex, 1);
    renderHighlightManagers();
  }

  // จัดการโพสต์ เพิ่ม/ลบได้ไม่จำกัด
  function renderPostsManager() {
    const box = document.getElementById("postsManager");
    box.innerHTML = "";
    postsData.forEach((p, idx) => {
      const wrap = document.createElement("div");
      wrap.className = "hl-edit-box";
      wrap.innerHTML = `
        <div class="hl-header-bar">
          <span class="hl-tag">โพสต์ที่ ${idx+1}</span>
          <button type="button" class="hl-delete-btn" onclick="removePostItem(${idx})">ลบโพสต์นี้</button>
        </div>
        <label class="file-btn">เลือกรูปโพสต์จากเครื่อง <input type="file" accept="image/*" style="display:none;" onchange="uploadDirectPost(event, ${idx})"></label>
        <input type="text" class="input-box" id="post-img-${idx}" value="${p.image || ''}" placeholder="หรือวางลิงก์รูป" oninput="postsData[${idx}].image = this.value" style="margin-bottom:6px;">
        <input type="text" class="input-box" value="${p.caption || ''}" placeholder="แคปชันโพสต์" oninput="postsData[${idx}].caption = this.value">
      `;
      box.appendChild(wrap);
    });
  }

  function addNewPostItem() {
    postsData.push({ image: "", caption: `Post ${postsData.length + 1}` });
    renderPostsManager();
  }

  function removePostItem(idx) {
    postsData.splice(idx, 1);
    renderPostsManager();
  }

  async function uploadDirectPost(event, postIdx) {
    const file = event.target.files[0];
    if (!file) return;
    showStatus("กำลังแปลงไฟล์รูปโพสต์...");
    try {
      const base64 = await compressImage(file, 900, 0.8);
      postsData[postIdx].image = base64;
      document.getElementById(`post-img-${postIdx}`).value = base64;
      showStatus("ใส่รูปโพสต์เรียบร้อย (อย่าลืมกดบันทึก)");
    } catch (err) {
      showStatus("แปลงรูปไม่สำเร็จ", true);
    }
  }

  function listenCustomerFeedbacks() {
    db.collection(DB_FEEDBACK).orderBy("createdAt", "desc").onSnapshot(snap => {
      const box = document.getElementById("customerFeedbackManager");
      box.innerHTML = "";
      if (snap.empty) {
        box.innerHTML = `<div style="text-align:center; color:var(--color-grey-soft); font-size:13px; padding:10px;">ยังไม่มีรีวิวส่งเข้ามา</div>`;
        return;
      }
      snap.forEach(doc => {
        const d = doc.data();
        const item = document.createElement("div");
        item.className = "review-del-item";
        item.innerHTML = `
          <div>
            <div style="font-weight:700; font-size:13px; color:var(--color-charcoal);">${d.name} (${'★'.repeat(d.stars || 5)})</div>
            <div style="font-size:12px; color:var(--text); margin-top:2px;">${d.msg}</div>
          </div>
          <button type="button" class="hl-delete-btn" onclick="deleteCustomerFeedback('${doc.id}')">ลบ</button>
        `;
        box.appendChild(item);
      });
    });
  }

  async function deleteCustomerFeedback(docId) {
    if (confirm("ต้องการลบรีวิวนี้ใช่ไหมคะ?")) {
      await db.collection(DB_FEEDBACK).doc(docId).delete();
      showStatus("ลบรีวิวสำเร็จ");
    }
  }

  async function saveAllConfig() {
    const btn = document.getElementById("saveBtn");
    btn.disabled = true;
    btn.textContent = "กำลังบันทึกข้อมูล...";
    showStatus("กำลังอัปเดตข้อมูลขึ้นระบบ...");

    const emailVal = document.getElementById("adminEmailInput").value.trim();
    if (emailVal) currentAdminEmail = emailVal;

    const cleanHighlights = highlightsData.map(h => ({
      title: h.title || "",
      cover: h.cover || (h.images && h.images[0]) || ""
    }));

    // บันทึก config หลัก (ไม่ยัดก้อนโพสต์ลงไป ทำให้ไฟล์เล็กมาก ไม่เกิน 1MB แน่นอน)
    const payload = {
      siteTitle: document.getElementById("siteTitle").value.trim(),
      username: document.getElementById("username").value.trim(),
      handle: document.getElementById("handle").value.trim(),
      bio: document.getElementById("bio").value.trim(),
      bannerImg: document.getElementById("bannerImg").value.trim(),
      profileImg: document.getElementById("profileImg").value.trim(),
      discordFrame: document.getElementById("discordFrame").value.trim(),

      highlights: cleanHighlights,

      details: document.getElementById("detailsContent").value.trim(),
      contacts: [
        { 
          title: document.getElementById("contactTitle1").value.trim() || "LINE (siamfineshyt)", 
          url: document.getElementById("contactUrl1").value.trim() 
        },
        { 
          title: document.getElementById("contactTitle2").value.trim() || "Donate click ♡", 
          url: document.getElementById("contactUrl2").value.trim() 
        },
        { 
          title: document.getElementById("contactTitle3").value.trim() || "ช่องทางอื่นๆ", 
          url: document.getElementById("contactUrl3").value.trim() 
        }
      ],

      musicUrl: document.getElementById("musicUrl").value.trim(),
      adminEmail: currentAdminEmail,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };

    const newPass = document.getElementById("newAdminPassword").value.trim();
    if (newPass) {
      payload.adminPass = newPass;
      currentAdminPass = newPass;
    }

    try {
      await db.collection(DB_SITE).doc("config").set(payload, { merge: true });

      // 1. บันทึกโพสต์แยกเป็น Collection เอกสารละ 1 โพสต์ (เพิ่มได้ไม่จำกัด ไม่ชน Limit)
      const existingPostsSnap = await db.collection(DB_POSTS).get();
      const pBatch = db.batch();
      existingPostsSnap.forEach(d => pBatch.delete(d.ref));
      await pBatch.commit();

      for (let i = 0; i < postsData.length; i++) {
        if (postsData[i].image) {
          await db.collection(DB_POSTS).add({
            idx: i,
            image: postsData[i].image,
            caption: postsData[i].caption || ""
          });
        }
      }

      // 2. บันทึกรูปสตอรี่ในแต่ละไฮไลท์แยก Sub-collection
      for (let i = 0; i < highlightsData.length; i++) {
        const slidesRef = db.collection(DB_HL_SLIDES).doc(String(i)).collection("images");
        const existingSnap = await slidesRef.get();
        const batch = db.batch();
        existingSnap.forEach(d => batch.delete(d.ref));
        await batch.commit();

        const imgs = highlightsData[i].images || [];
        for (let sIdx = 0; sIdx < imgs.length; sIdx++) {
          await slidesRef.doc(String(sIdx).padStart(4, '0')).set({
            idx: sIdx,
            url: imgs[sIdx]
          });
        }
      }

      showStatus("บันทึกข้อมูลทั้งหมดสำเร็จแล้ว");
      alert("บันทึกข้อมูลขึ้นระบบสำเร็จเรียบร้อยแล้วค่ะ! หมดปัญหาขนาดไฟล์เกิน 1MB แน่นอน ♡");
      document.getElementById("newAdminPassword").value = "";
    } catch (err) {
      showStatus("บันทึกไม่สำเร็จ: " + err.message, true);
      alert("เกิดข้อผิดพลาดในการบันทึก: " + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = "บันทึกขึ้นระบบทันที";
    }
  }

  function logout() {
    document.getElementById("dashboardBox").classList.add("hidden");
    document.getElementById("loginBox").classList.remove("hidden");
  }
</script>
</body>
</html>
